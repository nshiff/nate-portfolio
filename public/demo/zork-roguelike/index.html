<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Party</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111111;
      --border: #2a2a2a;
      --fg: #33ff66;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      color: var(--fg);
    }

    #titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }

    #titlebar .title {
      font-size: 0.875rem;
      letter-spacing: 0.05em;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 1.125rem;
      font-weight: bold;
      line-height: 1.6;
    }

    #inputline {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }

    #prompt {
      margin-right: 0.5rem;
      user-select: none;
      font-size: 1.125rem;
      font-weight: bold;
    }

    #cmd {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: inherit;
      font-family: inherit;
      font-size: 1.125rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    #cmd:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div id="titlebar">
    <span class="title"></span>
  </div>

  <div id="output"></div>

  <div id="inputline">
    <span id="prompt">&gt;</span>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
  </div>

  <script src="game.js"></script>
</body>

</html>
