<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fluid Simulation 2.0</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
        }

        .hint {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
            letter-spacing: 0.05em;
            pointer-events: none;
            user-select: none;
            transition: opacity 1s ease;
            white-space: nowrap;
        }

        .hint.faded {
            opacity: 0;
        }

        .unsupported {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            padding: 1rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <div id="hint" class="hint">touch &amp; drag &mdash; multi-touch works too</div>
    <script>
        (function () {
            'use strict';

            var canvas = document.getElementById('c');
            var hint = document.getElementById('hint');
            var gl = canvas.getContext('webgl2', { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false })
                || canvas.getContext('webgl', { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false });

            if (!gl) {
                var msg = document.createElement('div');
                msg.className = 'unsupported';
                msg.textContent = 'This demo needs WebGL, which your browser does not seem to support.';
                document.body.appendChild(msg);
                hint.style.display = 'none';
                return;
            }

            var isWebGL2 = ( typeof WebGL2RenderingContext !== 'undefined' ) && (gl instanceof WebGL2RenderingContext);
            var halfFloatType, supportLinearFiltering;

            if (isWebGL2) {
                gl.getExtension('EXT_color_buffer_float');
                gl.getExtension('EXT_color_buffer_half_float');
                halfFloatType = gl.HALF_FLOAT;
                supportLinearFiltering = true;
            } else {
                var halfFloatExt = gl.getExtension('OES_texture_half_float');
                supportLinearFiltering = !!gl.getExtension('OES_texture_half_float_linear');
                halfFloatType = halfFloatExt ? halfFloatExt.HALF_FLOAT_OES : gl.FLOAT;
                if (!halfFloatExt) {
                    gl.getExtension('OES_texture_float');
                    supportLinearFiltering = !!gl.getExtension('OES_texture_float_linear');
                }
            }

            function supportRenderTextureFormat(internalFormat, format, type) {
                var texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
                var fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
                gl.deleteFramebuffer(fbo);
                gl.deleteTexture(texture);
                return ok;
            }

            var formatRGBA, formatRG, formatR;
            if (isWebGL2) {
                formatRGBA = supportRenderTextureFormat(gl.RGBA16F, gl.RGBA, halfFloatType) ? { internalFormat: gl.RGBA16F, format: gl.RGBA } : null;
                formatRG = supportRenderTextureFormat(gl.RG16F, gl.RG, halfFloatType) ? { internalFormat: gl.RG16F, format: gl.RG } : null;
                formatR = supportRenderTextureFormat(gl.R16F, gl.RED, halfFloatType) ? { internalFormat: gl.R16F, format: gl.RED } : null;
                if (!formatRG) formatRG = formatRGBA;
                if (!formatR) formatR = formatRG;
            } else {
                formatRGBA = { internalFormat: gl.RGBA, format: gl.RGBA };
                formatRG = formatRGBA;
                formatR = formatRGBA;
            }

            var ext = { formatRGBA: formatRGBA, formatRG: formatRG, formatR: formatR, halfFloatType: halfFloatType, supportLinearFiltering: supportLinearFiltering };

            if (!ext.formatRGBA || !supportRenderTextureFormat(ext.formatRGBA.internalFormat, ext.formatRGBA.format, ext.halfFloatType)) {
                var msg = document.createElement('div');
                msg.className = 'unsupported';
                msg.textContent = 'This demo needs WebGL float render support, which this browser or device does not provide.';
                document.body.appendChild(msg);
                hint.style.display = 'none';
                return;
            }

            var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
            var prefersReducedMotion = false;
            try {
                prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            } catch (e) { /* noop */ }

            var QUALITY_TIERS = [
                { sim: 48, dye: 128 },
                { sim: 72, dye: 192 },
                { sim: 96, dye: 256 },
                { sim: 128, dye: 384 },
                { sim: 160, dye: 512 },
                { sim: 224, dye: 768 },
            ];
            var tier = isMobile ? 1 : 3;
            var dpr = Math.min(window.devicePixelRatio || 1, 2);

            function compileShader(type, source) {
                var shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    throw new Error(gl.getShaderInfoLog(shader) || 'shader compile failed');
                }
                return shader;
            }

            function createProgram(cs, as) {
                var program = gl.createProgram();
                gl.bindAttribLocation(program, 0, 'aPosition');
                gl.attachShader(program, cs);
                gl.attachShader(program, as);
                gl.linkProgram(program);
                if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    throw new Error(gl.getProgramInfoLog(program) || 'program link failed');
                }
                return program;
            }

            function getUniforms(program) {
                var uniforms = {};
                var count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
                for (var i = 0; i < count; i++) {
                    var name = gl.getActiveUniform(program, i).name;
                    uniforms[name] = gl.getUniformLocation(program, name);
                }
                return uniforms;
            }

            var baseVertex = [
                'precision highp float;',
                'attribute vec2 aPosition;',
                'varying vec2 vUv;',
                'varying vec2 vL;',
                'varying vec2 vR;',
                'varying vec2 vT;',
                'varying vec2 vB;',
                'uniform vec2 texelSize;',
                'void main () {',
                '    vUv = aPosition * 0.5 + 0.5;',
                '    vL = vUv - vec2(texelSize.x, 0.0);',
                '    vR = vUv + vec2(texelSize.x, 0.0);',
                '    vT = vUv + vec2(0.0, texelSize.y);',
                '    vB = vUv - vec2(0.0, texelSize.y);',
                '    gl_Position = vec4(aPosition, 0.0, 1.0);',
                '}'
            ].join('\n');

            var advectionSource = [
                'precision highp float;',
                'precision highp sampler2D;',
                'varying vec2 vUv;',
                'uniform sampler2D uVelocity;',
                'uniform sampler2D uSource;',
                'uniform vec2 texelSize;',
                'uniform vec2 dyeTexelSize;',
                'uniform float dt;',
                'uniform float dissipation;',
                'vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {',
                '    vec2 st = uv / tsize - 0.5;',
                '    vec2 iuv = floor(st);',
                '    vec2 fuv = fract(st);',
                '    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);',
                '    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);',
                '    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);',
                '    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);',
                '    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);',
                '}',
                'void main () {',
                '#ifdef MANUAL_FILTERING',
                '    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;',
                '    vec4 result = bilerp(uSource, coord, dyeTexelSize);',
                '#else',
                '    vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;',
                '    vec4 result = texture2D(uSource, coord);',
                '#endif',
                '    float decay = 1.0 + dissipation * dt;',
                '    gl_FragColor = result / decay;',
                '}'
            ].join('\n');

            var divergenceSource = [
                'precision mediump float;',
                'precision mediump sampler2D;',
                'varying highp vec2 vUv;',
                'varying highp vec2 vL;',
                'varying highp vec2 vR;',
                'varying highp vec2 vT;',
                'varying highp vec2 vB;',
                'uniform sampler2D uVelocity;',
                'void main () {',
                '    float L = texture2D(uVelocity, vL).x;',
                '    float R = texture2D(uVelocity, vR).x;',
                '    float T = texture2D(uVelocity, vT).y;',
                '    float B = texture2D(uVelocity, vB).y;',
                '    vec2 C = texture2D(uVelocity, vUv).xy;',
                '    if (vL.x < 0.0) { L = -C.x; }',
                '    if (vR.x > 1.0) { R = -C.x; }',
                '    if (vT.y > 1.0) { T = -C.y; }',
                '    if (vB.y < 0.0) { B = -C.y; }',
                '    float div = 0.5 * (R - L + T - B);',
                '    gl_FragColor = vec4(div, 0.0, 0.0, 1.0);',
                '}'
            ].join('\n');

            var curlSource = [
                'precision mediump float;',
                'precision mediump sampler2D;',
                'varying highp vec2 vUv;',
                'varying highp vec2 vL;',
                'varying highp vec2 vR;',
                'varying highp vec2 vT;',
                'varying highp vec2 vB;',
                'uniform sampler2D uVelocity;',
                'void main () {',
                '    float L = texture2D(uVelocity, vL).y;',
                '    float R = texture2D(uVelocity, vR).y;',
                '    float T = texture2D(uVelocity, vT).x;',
                '    float B = texture2D(uVelocity, vB).x;',
                '    float vorticity = R - L - T + B;',
                '    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);',
                '}'
            ].join('\n');

            var vorticitySource = [
                'precision highp float;',
                'precision highp sampler2D;',
                'varying vec2 vUv;',
                'varying vec2 vL;',
                'varying vec2 vR;',
                'varying vec2 vT;',
                'varying vec2 vB;',
                'uniform sampler2D uVelocity;',
                'uniform sampler2D uCurl;',
                'uniform float curl;',
                'uniform float dt;',
                'void main () {',
                '    float L = texture2D(uCurl, vL).x;',
                '    float R = texture2D(uCurl, vR).x;',
                '    float T = texture2D(uCurl, vT).x;',
                '    float B = texture2D(uCurl, vB).x;',
                '    float C = texture2D(uCurl, vUv).x;',
                '    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));',
                '    force /= length(force) + 0.0001;',
                '    force *= curl * C;',
                '    force.y *= -1.0;',
                '    vec2 velocity = texture2D(uVelocity, vUv).xy;',
                '    velocity += force * dt;',
                '    velocity = min(max(velocity, -1000.0), 1000.0);',
                '    gl_FragColor = vec4(velocity, 0.0, 1.0);',
                '}'
            ].join('\n');

            var pressureSource = [
                'precision mediump float;',
                'precision mediump sampler2D;',
                'varying highp vec2 vUv;',
                'varying highp vec2 vL;',
                'varying highp vec2 vR;',
                'varying highp vec2 vT;',
                'varying highp vec2 vB;',
                'uniform sampler2D uPressure;',
                'uniform sampler2D uDivergence;',
                'void main () {',
                '    float L = texture2D(uPressure, vL).x;',
                '    float R = texture2D(uPressure, vR).x;',
                '    float T = texture2D(uPressure, vT).x;',
                '    float B = texture2D(uPressure, vB).x;',
                '    float divergence = texture2D(uDivergence, vUv).x;',
                '    float pressure = (L + R + B + T - divergence) * 0.25;',
                '    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);',
                '}'
            ].join('\n');

            var gradientSubtractSource = [
                'precision mediump float;',
                'precision mediump sampler2D;',
                'varying highp vec2 vUv;',
                'varying highp vec2 vL;',
                'varying highp vec2 vR;',
                'varying highp vec2 vT;',
                'varying highp vec2 vB;',
                'uniform sampler2D uPressure;',
                'uniform sampler2D uVelocity;',
                'void main () {',
                '    float L = texture2D(uPressure, vL).x;',
                '    float R = texture2D(uPressure, vR).x;',
                '    float T = texture2D(uPressure, vT).x;',
                '    float B = texture2D(uPressure, vB).x;',
                '    vec2 velocity = texture2D(uVelocity, vUv).xy;',
                '    velocity.xy -= vec2(R - L, T - B);',
                '    gl_FragColor = vec4(velocity, 0.0, 1.0);',
                '}'
            ].join('\n');

            var clearSource = [
                'precision mediump float;',
                'precision mediump sampler2D;',
                'varying highp vec2 vUv;',
                'uniform sampler2D uTexture;',
                'uniform float value;',
                'void main () {',
                '    gl_FragColor = value * texture2D(uTexture, vUv);',
                '}'
            ].join('\n');

            var splatSource = [
                'precision highp float;',
                'precision highp sampler2D;',
                'varying vec2 vUv;',
                'uniform sampler2D uTarget;',
                'uniform float aspectRatio;',
                'uniform vec3 color;',
                'uniform vec2 point;',
                'uniform float radius;',
                'void main () {',
                '    vec2 p = vUv - point.xy;',
                '    p.x *= aspectRatio;',
                '    vec3 splat = exp(-dot(p, p) / radius) * color;',
                '    vec3 base = texture2D(uTarget, vUv).xyz;',
                '    gl_FragColor = vec4(base + splat, 1.0);',
                '}'
            ].join('\n');

            var displaySource = [
                'precision highp float;',
                'precision highp sampler2D;',
                'varying vec2 vUv;',
                'varying vec2 vL;',
                'varying vec2 vR;',
                'varying vec2 vT;',
                'varying vec2 vB;',
                'uniform sampler2D uTexture;',
                'uniform vec2 texelSize;',
                'void main () {',
                '    vec3 c = texture2D(uTexture, vUv).rgb;',
                '    vec3 lc = texture2D(uTexture, vL).rgb;',
                '    vec3 rc = texture2D(uTexture, vR).rgb;',
                '    vec3 tc = texture2D(uTexture, vT).rgb;',
                '    vec3 bc = texture2D(uTexture, vB).rgb;',
                '    float dx = length(rc) - length(lc);',
                '    float dy = length(tc) - length(bc);',
                '    vec3 n = normalize(vec3(dx, dy, length(texelSize)));',
                '    vec3 l = vec3(0.0, 0.0, 1.0);',
                '    float diffuse = clamp(dot(n, l) + 0.7, 0.7, 1.15);',
                '    c *= diffuse;',
                '    float a = max(c.r, max(c.g, c.b));',
                '    gl_FragColor = vec4(c, a);',
                '}'
            ].join('\n');

            var vertexShader = compileShader(gl.VERTEX_SHADER, baseVertex);
            var advectionProgram, filteringMacro = ext.supportLinearFiltering ? '' : '#define MANUAL_FILTERING\n';
            advectionProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, filteringMacro + advectionSource));
            var divergenceProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, divergenceSource));
            var curlProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, curlSource));
            var vorticityProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, vorticitySource));
            var pressureProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, pressureSource));
            var gradientSubtractProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, gradientSubtractSource));
            var clearProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, clearSource));
            var splatProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, splatSource));
            var displayProgram = createProgram(vertexShader, compileShader(gl.FRAGMENT_SHADER, displaySource));

            var advectionUniforms = getUniforms(advectionProgram);
            var divergenceUniforms = getUniforms(divergenceProgram);
            var curlUniforms = getUniforms(curlProgram);
            var vorticityUniforms = getUniforms(vorticityProgram);
            var pressureUniforms = getUniforms(pressureProgram);
            var gradientSubtractUniforms = getUniforms(gradientSubtractProgram);
            var clearUniforms = getUniforms(clearProgram);
            var splatUniforms = getUniforms(splatProgram);
            var displayUniforms = getUniforms(displayProgram);

            var quad = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, quad);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
            var quadIndices = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, quadIndices);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
            gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(0);

            function blit(target) {
                if (target == null) {
                    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
                    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
                } else {
                    gl.viewport(0, 0, target.width, target.height);
                    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
                }
                gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
            }

            function createFBO(w, h, internalFormat, format, type, filter) {
                gl.activeTexture(gl.TEXTURE0);
                var texture = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, texture);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
                var fbo = gl.createFramebuffer();
                gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
                gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
                gl.viewport(0, 0, w, h);
                gl.clearColor(0, 0, 0, 1);
                gl.clear(gl.COLOR_BUFFER_BIT);
                return {
                    texture: texture,
                    fbo: fbo,
                    width: w,
                    height: h,
                    texelSizeX: 1 / w,
                    texelSizeY: 1 / h,
                    attach: function (id) {
                        gl.activeTexture(gl.TEXTURE0 + id);
                        gl.bindTexture(gl.TEXTURE_2D, texture);
                        return id;
                    }
                };
            }

            function createDoubleFBO(w, h, internalFormat, format, type, filter) {
                var fbo1 = createFBO(w, h, internalFormat, format, type, filter);
                var fbo2 = createFBO(w, h, internalFormat, format, type, filter);
                return {
                    width: w,
                    height: h,
                    texelSizeX: 1 / w,
                    texelSizeY: 1 / h,
                    get read() { return fbo1; },
                    set read(v) { fbo1 = v; },
                    get write() { return fbo2; },
                    set write(v) { fbo2 = v; },
                    swap: function () { var t = fbo1; fbo1 = fbo2; fbo2 = t; }
                };
            }

            function getResolution(resolution) {
                var aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
                if (aspect < 1) aspect = 1 / aspect;
                var min = Math.round(resolution);
                var max = Math.round(resolution * aspect);
                if (gl.drawingBufferWidth > gl.drawingBufferHeight) {
                    return { width: max, height: min };
                }
                return { width: min, height: max };
            }

            function resizeDoubleFBO(target, w, h, internalFormat, format, type, filter) {
                if (target.width === w && target.height === h) return target;
                deleteFBO(target.read);
                deleteFBO(target.write);
                target.read = createFBO(w, h, internalFormat, format, type, filter);
                target.write = createFBO(w, h, internalFormat, format, type, filter);
                target.width = w;
                target.height = h;
                target.texelSizeX = 1 / w;
                target.texelSizeY = 1 / h;
                return target;
            }

            var filter = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

            function deleteFBO(fbo) {
                gl.deleteTexture(fbo.texture);
                gl.deleteFramebuffer(fbo.fbo);
            }

            var dye, velocity, divergence, curl, pressure;
            function initFramebuffers() {
                var simRes = getResolution(QUALITY_TIERS[tier].sim);
                var dyeRes = getResolution(QUALITY_TIERS[tier].dye);
                if (divergence) deleteFBO(divergence);
                if (curl) deleteFBO(curl);
                if (pressure) {
                    deleteFBO(pressure.read);
                    deleteFBO(pressure.write);
                }
                if (!dye) {
                    dye = createDoubleFBO(dyeRes.width, dyeRes.height, ext.formatRGBA.internalFormat, ext.formatRGBA.format, ext.halfFloatType, filter);
                } else {
                    dye = resizeDoubleFBO(dye, dyeRes.width, dyeRes.height, ext.formatRGBA.internalFormat, ext.formatRGBA.format, ext.halfFloatType, filter);
                }
                if (!velocity) {
                    velocity = createDoubleFBO(simRes.width, simRes.height, ext.formatRG.internalFormat, ext.formatRG.format, ext.halfFloatType, filter);
                } else {
                    velocity = resizeDoubleFBO(velocity, simRes.width, simRes.height, ext.formatRG.internalFormat, ext.formatRG.format, ext.halfFloatType, filter);
                }
                divergence = createFBO(simRes.width, simRes.height, ext.formatR.internalFormat, ext.formatR.format, ext.halfFloatType, gl.NEAREST);
                curl = createFBO(simRes.width, simRes.height, ext.formatR.internalFormat, ext.formatR.format, ext.halfFloatType, gl.NEAREST);
                pressure = createDoubleFBO(simRes.width, simRes.height, ext.formatR.internalFormat, ext.formatR.format, ext.halfFloatType, gl.NEAREST);
            }

            var pressureIterations = isMobile ? 16 : 20;
            var config = {
                densityDissipation: 1.0,
                velocityDissipation: 0.3,
                pressureDissipation: 0.8,
                curl: 26,
                radius: 0.18,
            };

            function resizeCanvas() {
                var w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
                var h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                    return true;
                }
                return false;
            }

            function splat(x, y, dx, dy, color) {
                gl.useProgram(splatProgram);
                gl.uniform1i(splatUniforms.uTarget, velocity.read.attach(0));
                gl.uniform1f(splatUniforms.aspectRatio, canvas.width / canvas.height);
                gl.uniform2f(splatUniforms.point, x, y);
                gl.uniform3f(splatUniforms.color, dx, dy, 0);
                gl.uniform1f(splatUniforms.radius, correctRadius(config.radius) / 100);
                blit(velocity.write);
                velocity.swap();

                gl.uniform1i(splatUniforms.uTarget, dye.read.attach(0));
                gl.uniform3f(splatUniforms.color, color.r, color.g, color.b);
                blit(dye.write);
                dye.swap();
            }

            function correctRadius(radius) {
                var aspect = canvas.width / canvas.height;
                if (aspect > 1) radius *= aspect;
                return radius;
            }

            function correctDelta(delta, isX) {
                var aspect = canvas.width / canvas.height;
                if (isX && aspect < 1) delta *= aspect;
                if (!isX && aspect > 1) delta /= aspect;
                return delta;
            }

            function splatStrokes(pointer) {
                var dx = correctDelta(pointer.deltaX, true) * 6000;
                var dy = correctDelta(pointer.deltaY, false) * 6000;
                splat(pointer.x, pointer.y, dx, dy, pointer.color);
            }

            function hsvColor(h) {
                h = h % 1;
                var i = Math.floor(h * 6);
                var f = h * 6 - i;
                var q = 1 - f;
                var rgb;
                switch (i % 6) {
                    case 0: rgb = [1, f, 0]; break;
                    case 1: rgb = [q, 1, 0]; break;
                    case 2: rgb = [0, 1, f]; break;
                    case 3: rgb = [0, q, 1]; break;
                    case 4: rgb = [f, 0, 1]; break;
                    default: rgb = [1, 0, q]; break;
                }
                return { r: rgb[0] * 0.15, g: rgb[1] * 0.15, b: rgb[2] * 0.15 };
            }

            var hue = Math.random();
            var pointers = new Map();
            var lastInteraction = 0;

            function getPos(e) {
                var rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) / rect.width,
                    y: 1 - (e.clientY - rect.top) / rect.height,
                };
            }

            canvas.addEventListener('pointerdown', function (e) {
                var pos = getPos(e);
                pointers.set(e.pointerId, { x: pos.x, y: pos.y, deltaX: 0, deltaY: 0, color: hsvColor(hue += 0.13) });
                try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
                lastInteraction = performance.now();
                hint.classList.add('faded');
            });

            canvas.addEventListener('pointermove', function (e) {
                var pos = getPos(e);
                var pointer = pointers.get(e.pointerId);
                if (!pointer) return;
                pointer.deltaX = pos.x - pointer.x;
                pointer.deltaY = pos.y - pointer.y;
                pointer.x = pos.x;
                pointer.y = pos.y;
                lastInteraction = performance.now();
            });

            function endPointer(e) {
                pointers.delete(e.pointerId);
            }
            canvas.addEventListener('pointerup', endPointer);
            canvas.addEventListener('pointercancel', endPointer);
            canvas.addEventListener('pointerleave', endPointer);

            function idleSplats() {
                var count = isMobile ? 3 : 5;
                for (var i = 0; i < count; i++) {
                    var color = hsvColor(hue += 0.09);
                    color.r *= 6;
                    color.g *= 6;
                    color.b *= 6;
                    var x = Math.random();
                    var y = Math.random();
                    var dx = 800 * (Math.random() - 0.5);
                    var dy = 800 * (Math.random() - 0.5);
                    splat(x, y, dx, dy, color);
                }
            }

            function step(dt) {
                gl.disable(gl.BLEND);

                gl.useProgram(curlProgram);
                gl.uniform2f(curlUniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(curlUniforms.uVelocity, velocity.read.attach(0));
                blit(curl);

                gl.useProgram(vorticityProgram);
                gl.uniform2f(vorticityUniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(vorticityUniforms.uVelocity, velocity.read.attach(0));
                gl.uniform1i(vorticityUniforms.uCurl, curl.attach(1));
                gl.uniform1f(vorticityUniforms.curl, config.curl);
                gl.uniform1f(vorticityUniforms.dt, dt);
                blit(velocity.write);
                velocity.swap();

                gl.useProgram(divergenceProgram);
                gl.uniform2f(divergenceUniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(divergenceUniforms.uVelocity, velocity.read.attach(0));
                blit(divergence);

                gl.useProgram(clearProgram);
                gl.uniform1i(clearUniforms.uTexture, pressure.read.attach(0));
                gl.uniform1f(clearUniforms.value, config.pressureDissipation);
                blit(pressure.write);
                pressure.swap();

                gl.useProgram(pressureProgram);
                gl.uniform2f(pressureUniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(pressureUniforms.uDivergence, divergence.attach(0));
                for (var i = 0; i < pressureIterations; i++) {
                    gl.uniform1i(pressureUniforms.uPressure, pressure.read.attach(1));
                    blit(pressure.write);
                    pressure.swap();
                }

                gl.useProgram(gradientSubtractProgram);
                gl.uniform2f(gradientSubtractUniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                gl.uniform1i(gradientSubtractUniforms.uPressure, pressure.read.attach(0));
                gl.uniform1i(gradientSubtractUniforms.uVelocity, velocity.read.attach(1));
                blit(velocity.write);
                velocity.swap();

                gl.useProgram(advectionProgram);
                gl.uniform2f(advectionUniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
                if (!ext.supportLinearFiltering) {
                    gl.uniform2f(advectionUniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
                }
                var velocityId = velocity.read.attach(0);
                gl.uniform1i(advectionUniforms.uVelocity, velocityId);
                gl.uniform1i(advectionUniforms.uSource, velocityId);
                gl.uniform1f(advectionUniforms.dt, dt);
                gl.uniform1f(advectionUniforms.dissipation, config.velocityDissipation);
                blit(velocity.write);
                velocity.swap();

                if (!ext.supportLinearFiltering) {
                    gl.uniform2f(advectionUniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
                }
                gl.uniform1i(advectionUniforms.uVelocity, velocity.read.attach(0));
                gl.uniform1i(advectionUniforms.uSource, dye.read.attach(1));
                gl.uniform1f(advectionUniforms.dissipation, config.densityDissipation);
                blit(dye.write);
                dye.swap();
            }

            function render() {
                gl.useProgram(displayProgram);
                gl.uniform2f(displayUniforms.texelSize, dye.texelSizeX, dye.texelSizeY);
                gl.uniform1i(displayUniforms.uTexture, dye.read.attach(0));
                blit(null);
            }

            function applyPointerInput() {
                pointers.forEach(function (pointer) {
                    if (pointer.deltaX !== 0 || pointer.deltaY !== 0) {
                        splatStrokes(pointer);
                        pointer.deltaX = 0;
                        pointer.deltaY = 0;
                    }
                });
            }

            var lastTime = performance.now();
            var frameAccum = 0;
            var frameCount = 0;
            var running = true;

            document.addEventListener('visibilitychange', function () {
                running = !document.hidden;
                if (running) lastTime = performance.now();
            });

            function adjustQuality(avgMs) {
                if (avgMs > 24 && tier > 0) {
                    tier--;
                    initFramebuffers();
                } else if (avgMs < 11 && tier < QUALITY_TIERS.length - 1) {
                    tier++;
                    initFramebuffers();
                }
            }

            function frame(now) {
                var dt = Math.min((now - lastTime) / 1000, 1 / 30);
                lastTime = now;

                if (resizeCanvas()) initFramebuffers();

                applyPointerInput();

                if (prefersReducedMotion) {
                    if (!pointers.size) {
                        requestAnimationFrame(frame);
                        return;
                    }
                } else {
                    if (dt > 0) step(dt);
                    if (now - lastInteraction > 8000) {
                        idleSplats();
                        lastInteraction = now;
                    }
                }

                render();

                frameAccum += dt * 1000;
                frameCount++;
                if (frameCount >= 60) {
                    adjustQuality(frameAccum / frameCount);
                    frameAccum = 0;
                    frameCount = 0;
                }

                requestAnimationFrame(frame);
            }

            resizeCanvas();
            initFramebuffers();
            if (!prefersReducedMotion) {
                idleSplats();
                setTimeout(function () { hint.classList.add('faded'); }, 6000);
            } else {
                hint.textContent = 'touch & drag to stir the fluid';
            }

            canvas.addEventListener('webglcontextlost', function (e) {
                e.preventDefault();
            });

            requestAnimationFrame(function (t) {
                lastTime = t;
                requestAnimationFrame(frame);
            });
        })();
    </script>
</body>

</html>
